# Optional: a VM layer on base.qcow2 for software the product needs on the machine (servers, databases, services).
# Built by `vmt layer @PRODUCT@ --test | --build`; a target uses it with GOLDEN_IMAGE=<LAYER>.qcow2.
# Delete this folder when the product needs nothing beyond the golden image.
LAYER="@PRODUCT@"
# Host files copied to the guest's C:\factory\layer\ (installers without a public URL: keep them in <VM home>/installers/).
LAYER_FILES=""
# "<guest folder>=<host folder>" pairs, copied to C:\factory\layer\<guest folder>\.
LAYER_DIRS=""
