# The devolutions-console layer (../layer.md): built by `vmt layer console --test | --build`, which copies these
# files into the guest's C:\factory\layer\ and runs setup.ps1 there.
LAYER=devolutions-console

# The Devolutions Server Console installer has no public URL: put Setup.DVLS.Console*.exe in <VM home>/installers/.
LAYER_FILES=$(ls "$VM_HOME"/installers/Setup.DVLS.Console*.exe 2> /dev/null | tail -1)
[ -n "$LAYER_FILES" ] || { echo "layer: put Setup.DVLS.Console*.exe in $VM_HOME/installers/" >&2; return 1; }

# Until a Console release ships DEVEX-552 (the CLI's Kestrel options), the Kestrel instance needs a CLI built from master:
#   dotnet build DVLS/Console/Console.Cli/DPS.Console.CLI.csproj -c Debug -r win-arm64 --self-contained false
#     -p:EnableWindowsTargeting=true, then PATCHED_CLI=<that project>/bin/Debug/net10.0-windows/win-arm64
# Without it setup.ps1 leaves Kestrel as a MANUAL step.
LAYER_DIRS=${PATCHED_CLI:+cli-patched=$PATCHED_CLI}
